name: Finding normalization tests
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - run: python -m src.normalize --input data/findings.json --output backlog.json
      - run: python -c 'import json; x=json.load(open("backlog.json")); assert x["unique_count"] == 3'
